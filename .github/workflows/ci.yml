name: EvoTrade AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evotrade
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evotrade
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d evotrade"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Run tests
        run: python -m pytest -q

      - name: Validate docker compose config
        run: docker compose config

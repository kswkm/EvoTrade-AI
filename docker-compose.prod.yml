services:
  app:
    image: evotrade-ai:prod
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/evotrade
    expose:
      - "8000"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: evotrade-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  postgres:
    environment:
      POSTGRES_DB: evotrade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always

services:
  - type: web
    name: evotrade-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_conf.py app.main:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: evotrade-db
          property: connectionString
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: RISK_MAX_POSITION_VALUE
        value: "100000"
      - key: RISK_MAX_DAILY_LOSS_PCT
        value: "0.05"
      - key: RISK_MAX_ORDER_VALUE_PCT
        value: "0.2"

databases:
  - name: evotrade-db
    databaseName: evotrade
    user: evotrade
    plan: free
